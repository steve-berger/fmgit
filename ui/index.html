<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fmgit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2328'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='14' fill='%23fff' text-anchor='middle'%3Efm%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="toolbar" id="toolbar" aria-label="Repository toolbar"></header>
  <div class="banner" id="banner"></div>
  <nav class="rail" id="nav" aria-label="Sections">
    <a href="#/changes" data-tab="changes"></a>
    <a href="#/history" data-tab="history"></a>
    <a href="#/objects" data-tab="objects"></a>
    <a href="#/branches" data-tab="branches"></a>
    <a href="#/prs" data-tab="prs"></a>
    <span class="grow"></span>
    <a href="#/settings" data-tab="settings"></a>
  </nav>
  <aside class="pane list" id="list" aria-label="List"></aside>
  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize list"></div>
  <main class="pane detail" id="view" tabindex="-1"></main>
  <section class="console" id="console" aria-label="Command output">
    <header><strong>Output</strong><span class="grow"></span><button type="button" id="con-clear" class="btn-link">Clear</button></header>
    <pre id="con-out" aria-live="polite"></pre>
  </section>
  <footer class="statusbar">
    <div class="sb-left" id="sb"></div>
    <span id="con-state" class="con-state"></span>
    <button type="button" id="con-toggle" class="sb-btn" aria-expanded="false" aria-controls="console">Output</button>
  </footer>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js" type="module"></script>
</body>
</html>
